name: Collecteur Orange

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-orange
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Générer un jeton temporaire GitHub App
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PRIVATE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_APP_PRIVATE_KEY }}
          owner: 237ytreza

      - name: Cloner le dépôt privé
        run: |
          git clone --depth 1 --single-branch \
            "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/237ytreza/vpn-files-generator-workflows.git" \
            work

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v1
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache Chromium
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
          restore-keys: ${{ runner.os }}-playwright-chromium-

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip --cache-dir ~/.cache/pip
          pip install --cache-dir ~/.cache/pip requests supabase pycryptodome playwright
          if [ "${{ steps.pw_cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
        working-directory: work

      - name: Lancer le collecteur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/run_collect.py
        working-directory: work

      - name: Nettoyage
        if: always()
        run: rm -rf work
