name: Collecteur Orange (exécution du dépôt privé)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: collect-orange
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer le jeton GitHub App (lecture seule du dépôt privé)
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PRIVATE_APP_ID }}
          private-key: ${{ secrets.PRIVATE_APP_PRIVATE_KEY }}
          owner: <votre_nom_d_utilisateur>
          repositories: vpn-files-generator-workflows

      - name: Cloner le dépôt privé
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${APP_TOKEN}@github.com/<votre_nom_d_utilisateur>/vpn-files-generator-workflows.git" work

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache Chromium (Playwright)
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
          restore-keys: ${{ runner.os }}-playwright-chromium-

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 playwright pycryptodome msgpack supabase

      - name: Installer Chromium (seulement si cache manquant)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Lancer le collecteur
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_ORANGE_REPROCESS: "1"
        working-directory: work
        run: python scripts/run_collect.py
